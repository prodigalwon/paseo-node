[package]
name = "paseo-node"
description = "Unified Paseo parachain node: PNS + ZK-PKI + Secret Squirrel."
version = "0.1.0"
license = "Apache-2.0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

build = "build.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true

[dependencies]
clap = { features = ["derive"], workspace = true }
codec = { workspace = true, default-features = true }
futures = { features = ["thread-pool"], workspace = true }
jsonrpsee = { features = ["server"], workspace = true }
log = "0.4"
tracing = { workspace = true }

# substrate client
serde = { workspace = true, default-features = true }
sc-basic-authorship = { workspace = true, default-features = true }
sc-chain-spec = { workspace = true, default-features = true }
sc-cli = { workspace = true, default-features = true }
sc-client-api = { workspace = true, default-features = true }
sc-consensus = { workspace = true, default-features = true }
sc-consensus-aura = { workspace = true, default-features = true }
sc-executor = { workspace = true, default-features = true }
sc-network = { workspace = true, default-features = true }
sc-offchain = { workspace = true, default-features = true }
sc-service = { workspace = true, default-features = true }
sc-sysinfo = { workspace = true, default-features = true }
sc-tracing = { workspace = true, default-features = true }
sc-rpc = { workspace = true, default-features = true }
sc-telemetry = { workspace = true, default-features = true }
sc-transaction-pool = { workspace = true, default-features = true }
sc-transaction-pool-api = { workspace = true, default-features = true }
sp-consensus-aura = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-genesis-builder = { workspace = true, default-features = true }

# substrate primitives
sp-api = { workspace = true, default-features = true }
sp-block-builder = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-inherents = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-keyring = { workspace = true, default-features = true }
sp-keystore = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
sp-timestamp = { workspace = true, default-features = true }

# cumulus — collator client
cumulus-client-bootnodes = { workspace = true, default-features = true }
cumulus-client-cli = { workspace = true, default-features = true }
cumulus-client-collator = { workspace = true, default-features = true }
cumulus-client-consensus-aura = { workspace = true, default-features = true }
cumulus-client-consensus-common = { workspace = true, default-features = true }
cumulus-client-service = { workspace = true, default-features = true }
cumulus-primitives-core = { workspace = true, default-features = true }
cumulus-primitives-parachain-inherent = { workspace = true, default-features = true }
cumulus-relay-chain-interface = { workspace = true, default-features = true }
polkadot-primitives = { workspace = true, default-features = true }
polkadot-cli = { workspace = true, default-features = true }

# frame and pallets
frame-metadata-hash-extension = { workspace = true, default-features = true }
frame-system = { workspace = true, default-features = true }
pallet-transaction-payment = { workspace = true, default-features = true }
pallet-transaction-payment-rpc = { workspace = true, default-features = true }
substrate-frame-rpc-system = { workspace = true, default-features = true }
substrate-prometheus-endpoint = { workspace = true, default-features = true }

# benchmarking
frame-benchmarking-cli = { workspace = true, default-features = true }

# local runtime
paseo-runtime = { workspace = true }

# PNS
pns-runtime-api = { workspace = true, default-features = true }
pns-types = { workspace = true, default-features = true }
pns-ddns = { workspace = true }
hickory-proto = { workspace = true }

# ZK-PKI RPC
zk-pki-rpc = { workspace = true }
zk-pki-primitives = { workspace = true, default-features = true }

# Secret Squirrel runtime API (for RPC bounds)
secret-squirrel-runtime-api = { workspace = true, default-features = true }

[build-dependencies]
substrate-build-script-utils = { workspace = true, default-features = true }

[features]
# `test-attestation` rides in the default set so the wasm sub-build
# (triggered by `substrate-wasm-builder`) inherits it — wasm-builder
# reads `CARGO_FEATURE_TEST_ATTESTATION` from the outer build's env
# and forwards matching features to the inner wasm crate. Without
# this forwarding, `zk_pki_tpm::test_mock_verifier` is cfg'd out and
# the runtime fails to compile. Mainnet builds must pass
# `--no-default-features --features std,production` at the workspace
# level to get the attestation-hardened runtime.
default = ["std", "test-attestation"]
std = ["paseo-runtime/std"]
test-attestation = ["paseo-runtime/test-attestation"]
production = ["paseo-runtime/production"]
runtime-benchmarks = [
	"frame-benchmarking-cli/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-transaction-payment/runtime-benchmarks",
	"sc-service/runtime-benchmarks",
	"paseo-runtime/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-system/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"paseo-runtime/try-runtime",
	"sp-runtime/try-runtime",
]
